name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore PharmacyManagement.sln
      - name: Build WinForms application
        run: dotnet build PharmacyManagement.sln --configuration Release --no-restore
      - name: Restore test packages
        run: dotnet restore PharmacyManagement.Tests/PharmacyManagement.Tests.csproj
      - name: Run unit tests
        run: dotnet test PharmacyManagement.Tests/PharmacyManagement.Tests.csproj --no-restore --configuration Release
